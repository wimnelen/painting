<main class="wrap">

  <header class="banner">
    <div class="path">C:\PORTFOLIO\<span class="accent">WORK.LST</span></div>
    <h1>WIM_NELEN — PAINTINGS<span class="cursor"></span></h1>
    <p>Wim Nelen is a Belgian painter exploring the intersection of nature and human experience.</p>
  </header>

  <div class="feature">
    <div class="feature-canvas">
      <img src="images/Sand-Dunes-Frontier.jpg" alt="Sand Dunes Frontier">
    </div>
  </div>
  <div class="feature-caption">FEATURED — <span class="accent">Sand Dunes Frontier</span>, oil on board, 2024</div>

  <div class="section-head">
    <h2>GALLERY</h2>
    <span class="count">5 FILES</span>
  </div>

  <div class="gallery" id="gallery">

    <button class="piece" data-title="Sand Dunes Frontier" data-meta="Oil on board, 60 x 60 cm or 24 x 24 inch, 2024" data-no="FILE 001" data-tex="tex-1">
      <div class="thumb tex-1">
        <img src="images/Sand-Dunes-Frontier.jpg" alt="Sand Dunes Frontier">
      </div>
      <div class="piece-info">
        <span class="no">FILE 001</span>
        <p class="title">Sand Dunes Frontier</p>
        <p class="meta">Oil on board, 60 x 60 cm, 2024</p>
        <p class="desc">Inspired by the micro-world of sand dunes on a camping trip to Ile de Ré in France. Inspired by Van Gogh's directional brushstrokes and taking this a step further by aggressively applying thick paint to capture the chaotic enery of plants making space for themselves on the frontier of uninhabitable terrain.</p>
      </div>
    </button>

    <button class="piece" data-title="Cast no Shadow" data-meta="Oil on canvas, 45 x 60 cm or 18 x 24 inch, 2025" data-no="FILE 002" data-tex="tex-2">
      <div class="thumb tex-2">
        <img src="images/Cast-no-Shadow.png" alt="original large scale oil painting landscape with pine and dead trunk blue purple sky">
        <video src="images/Cast-no-Shadow.mp4" autoplay muted loop playsinline></video>
      </div>
      <div class="piece-info">
        <span class="no">FILE 002</span>
        <p class="title">Cast no Shadow</p>
        <p class="meta">Oil on canvas, 45 x 60 cm or 18 x 24 inch, 2025</p>
        <p class="desc">Inspired by how Odd Nerdrum's Appelles school of painting preps the canvas with chalk and linseed oil. Taking this a step further for a dramatic impasto effect on a reflection of circularity of nature. Mood colours inspired by Doron Langberg's landscapes that were presented at Jeffrey Deitch's gallery at time of painting.</p>
      </div>
    </button>

    <button class="piece" data-title="Kempisch Landschap" data-meta="Oil, acrylic and spray paint on paper, 59.4 x 84 cm or 23,4 x 33,1 inch, 2026" data-no="FILE 003" data-tex="tex-3">
      <div class="thumb tex-3">
        <img src="images/Kempisch-Landschap.png" alt="acrylic and oil painting with spray paint graffiti of a landscap typical for the Kempen region in Flanders, with pine tree and impressionistic layered brushstrokes">
      </div>
      <div class="piece-info">
        <span class="no">FILE 003</span>
        <p class="title">Kempisch landschap</p>
        <p class="meta">Oil, acrylic and spray paint on paper, 59.4 x 84 cm or 23,4 x 33,1 inch, 2026</p>
        <p class="desc">Inspired by the typical landscapes of my youth in the Kempen region in Flanders, with sandy ground reflecting sunlight, pine trees and birches. Impressionisticly layered colours inspired by the works of Claude Monet and Camille Pisarro. Inspired try my hand at graffiti.</p>
      </div>
    </button>

    <button class="piece" data-title="Werchters Broek" data-meta="Oil on canvas, 200 x 200 cm or 79 x 79 inch, 2026" data-no="FILE 004" data-tex="tex-4">
      <div class="thumb tex-4">
        <img src="images/Werchters-Broek.png" alt="large oil painting of landscape with trees golden hour Werchters Broek">
      </div>
      <div class="piece-info">
        <span class="no">FILE 004</span>
        <p class="title">Werchters Broek</p>
        <p class="meta">Oil on canvas, 200 x 200 cm or 79 x 79 inch, 2026</p>
        <p class="desc">Inspired by a sunset when cycling along the Demer river in Werchter. Inspired by fractured landscape perspectives and layered paint application of Alex Kanevsky. Inspired by the mood in the landscapes of Doron Langberg.</p>
      </div>
    </button>

    <button class="piece" data-title="The Donald" data-meta="Oil on canvas, 100 x 100 cm or 39 x 39 inch, 2026" data-no="FILE 005" data-tex="tex-5">
      <div class="thumb tex-5">
        <img src="images/The-Donald.png" alt="classically glazed oil painting of a nautical tragedy on a stormy golden sea with duck and characters throwing stones">
      </div>
      <div class="piece-info">
        <span class="no">FILE 005</span>
        <p class="title">The Donald</p>
        <p class="meta">Oil on canvas, 100 x 100 cm or 39 x 39 inch, 2026</p>
        <p class="desc">Inspired by a surrealist project in my painting course at SLAC academy. Inspired by Gericault's master piece "The Raft of the Medusa". Inspired by Rubens' complex multi-figure compositions.</p>
      </div>
    </button>
